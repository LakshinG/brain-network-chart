[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brain-network-chart"
version = "0.1.0"
description = "A Python project for brain-network-chart"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Ziquan Wei", email = "ziquanw@email.unc.edu"}
]
dependencies = [
    "duckduckgo-search>=8.1.1",
    "h5py>=3.10.0",
    "mcp>=1.0.0",
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "pydantic>=2.0.0",
    "pydantic-ai>=1.51.0",
    "scipy>=1.11.0",
    "ollama",
    "statsmodels",
    "fastapi",
    "uvicorn",
    "python-multipart>=0.0.9",
    "requests>=2.31.0",
    "starlette>=0.37.0",
    "fastmcp>=2.14.4",
    "pillow"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=22.0",
    "flake8>=4.0",
    "mypy>=0.900"
]

[tool.setuptools]
packages = ["tool_utils"]

[tool.black]
line-length = 88
target-version = ["py38"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]