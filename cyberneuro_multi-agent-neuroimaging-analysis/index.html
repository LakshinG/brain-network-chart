
<!DOCTYPE html>

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CyberNeuro Analysis Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #e2e8f0; }
      /* Custom scrollbar for dark theme */
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: #1e293b; }
      ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: #64748b; }

      /* Smooth message fade-in */
      @keyframes fadeSlideIn {
        from { opacity: 0; transform: translateY(8px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in {
        animation: fadeSlideIn 0.25s ease-out both;
      }
      
      /* Marquee for scatter plot legend */
      @keyframes scroll {
        0% { transform: translateX(0); }
        30% { transform: translateX(0); }
        100% { transform: translateX(-100%); }
      }
      .animate-scroll-text {
        animation: scroll 8s linear infinite;
        display: inline-block;
        white-space: nowrap;
      }
      .animate-scroll-text:hover {
        animation-play-state: paused;
      }
    </style>
  <script type="importmap">

  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>

    <!--
      Visitor tracking widget (mapmyvisitors.com)
      -----------------------------------------------------------------
      Tracking ID (the "d=" param) is registered to this site on the
      mapmyvisitors.com dashboard. Renders as a collapsible banner docked
      to the bottom of the page, collapsed by default.
    -->
    <style>
      #visitor-map-banner {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 9999;
        background: rgba(15, 23, 42, 0.92);
        border-top: 1px solid #334155;
        backdrop-filter: blur(6px);
        font-family: 'Inter', sans-serif;
        transform: translateY(0);
        transition: transform 0.3s ease;
      }
      /* When collapsed, slide the panel down so only the tab remains visible */
      #visitor-map-banner.collapsed { transform: translateY(100%); }
      /* Tab docks bottom-left to stay clear of the chat composer's Send button
         (bottom-right of the app's right panel). */
      #visitor-map-toggle {
        position: absolute;
        top: -28px;
        left: 16px;
        height: 28px;
        padding: 0 12px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: rgba(15, 23, 42, 0.92);
        border: 1px solid #334155;
        border-bottom: none;
        border-radius: 8px 8px 0 0;
        color: #e2e8f0;
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        line-height: 1;
      }
      #visitor-map-toggle:hover { background: rgba(30, 41, 59, 0.95); }
      #visitor-map-toggle .chev { transition: transform 0.3s ease; }
      #visitor-map-banner.collapsed #visitor-map-toggle .chev { transform: rotate(180deg); }
      #visitor-map-panel {
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 10px 16px;
        max-height: 220px;
        overflow: hidden;
      }
      /* The map.js widget sizes itself to its parent's width (w=a means
         adaptive), so it must live in a fixed-width box — otherwise it
         renders a viewport-wide map. Also hard-cap anything it injects. */
      #visitor-map-widget-box {
        width: 320px;
        max-width: 90vw;
        max-height: 200px;
        overflow: hidden;
      }
      #visitor-map-widget-box div,
      #visitor-map-widget-box a,
      #visitor-map-widget-box img,
      #visitor-map-widget-box canvas,
      #visitor-map-widget-box iframe {
        max-width: 100% !important;
        max-height: 200px !important;
      }
    </style>
    <div id="visitor-map-banner" class="collapsed">
      <button id="visitor-map-toggle" type="button"
              aria-controls="visitor-map-panel" aria-expanded="false"
              onclick="(function(b){var c=b.classList.toggle('collapsed');this.setAttribute('aria-expanded', String(!c));}).call(this, document.getElementById('visitor-map-banner'))">
        <span>Visitor map</span>
        <span class="chev" aria-hidden="true">▾</span>
      </button>
      <div id="visitor-map-panel">
        <!-- Official snippet verbatim (no async: map.js relies on finding
             its own script tag at parse time to place the widget). -->
        <div id="visitor-map-widget-box">
          <script type="text/javascript" id="mapmyvisitors"
                  src="//mapmyvisitors.com/map.js?d=GZumtsJdo4jDnnw7HH45fJf67frmEtgjtHEhoAexSds&cl=ffffff&w=a"></script>
        </div>
      </div>
    </div>
  </body>
